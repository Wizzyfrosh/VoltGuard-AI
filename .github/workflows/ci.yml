name: VoltGuard validation

on:
  push:
    branches: [main, phase-6/web-testing, roadmap/production-feature-program, phase-0/stabilization-audit, phase-9-dependency-security, phase-10-alert-reliability, phase-a/product-polish-settings-legal, phase-b/telemetry-reliability, phase-c/battery-analytics-hardening, phase-d/device-insights-async-native, phase-e/production-hardening, phase-f/onboarding-permissions, phase-g/anti-theft]
  pull_request:
    branches: [main, phase-6/web-testing, roadmap/production-feature-program, phase-0/stabilization-audit, phase-9-dependency-security, phase-10-alert-reliability, phase-a/product-polish-settings-legal, phase-b/telemetry-reliability, phase-c/battery-analytics-hardening, phase-d/device-insights-async-native, phase-e/production-hardening, phase-f/onboarding-permissions, phase-g/anti-theft]

permissions:
  contents: read

concurrency:
  group: voltguard-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: TypeScript, lint and web export
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Export web app
        run: npx expo export --platform web

  android-native-build:
    if: github.ref != 'refs/heads/phase-6/web-testing' && github.event.pull_request.head.ref != 'phase-6/web-testing'
    name: Android native module compile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Generate Android native project
        run: npx expo prebuild --platform android --no-install

      - name: Compile Android Kotlin
        working-directory: android
        run: ./gradlew :app:compileDebugKotlin

      - name: Configure release APK for device testing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/app/build.gradle')
          source = path.read_text()
          marker = '    release {\n'
          if marker not in source:
              raise SystemExit('Could not find Android release build type in generated Gradle file')
          source = source.replace(marker, marker + '      signingConfig signingConfigs.debug\n', 1)
          path.write_text(source)
          PY

      - name: Assemble standalone release APK
        working-directory: android
        run: ./gradlew :app:assembleRelease

      - name: Upload standalone Android APK
        uses: actions/upload-artifact@v4
        with:
          name: voltguard-android-standalone-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7

  dependency-audit:
    name: npm dependency security audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Generate npm audit report
        run: |
          npm audit --json > npm-audit.json || true
          node -e "const r=require('./npm-audit.json'); const v=r.metadata?.vulnerabilities ?? {}; console.log('Vulnerability summary:', JSON.stringify(v)); for (const [name, item] of Object.entries(r.vulnerabilities ?? {})) console.log(name + ': ' + item.severity + ' | direct=' + item.isDirect + ' | fixAvailable=' + JSON.stringify(item.fixAvailable));"

      - name: Upload dependency audit report
        uses: actions/upload-artifact@v4
        with:
          name: voltguard-npm-audit-report
          path: npm-audit.json
          if-no-files-found: error
          retention-days: 14

  safe-dependency-remediation-preview:
    name: Safe dependency remediation preview
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply non-breaking dependency fixes only
        run: |
          npm audit fix || audit_fix_exit=$?
          echo "npm audit fix exit code: ${audit_fix_exit:-0}"

      - name: TypeScript
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Export web app
        run: npx expo export --platform web

      - name: Generate post-remediation audit report
        run: |
          npm audit --json > npm-audit-after.json || true
          node -e "const r=require('./npm-audit-after.json'); console.log('Post-remediation vulnerability summary:', JSON.stringify(r.metadata?.vulnerabilities ?? {}));"

      - name: Upload safe remediation preview
        uses: actions/upload-artifact@v4
        with:
          name: voltguard-safe-remediation-preview
          path: |
            package-lock.json
            npm-audit-after.json
          if-no-files-found: error
          retention-days: 7

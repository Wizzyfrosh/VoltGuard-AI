name: Phase 1 validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: voltguard-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: TypeScript, lint and web export
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Export web app
        run: npx expo export --platform web

name: VoltGuard validation

on:
  push:
    branches: [main, phase-6/web-testing, roadmap/production-feature-program, phase-0/stabilization-audit, phase-9-dependency-security, phase-b/telemetry-reliability, phase-c/battery-analytics-hardening, phase-d/device-insights-async-native, security/selective-transitive-patches]
  pull_request:
    branches: [main, phase-0/stabilization-audit, phase-5/dashboard-redesign-battery-fix, phase-6/web-testing, phase-a/product-polish-settings-legal, phase-b/telemetry-reliability, phase-c/battery-analytics-hardening, phase-d/device-insights-async-native]

permissions:
  contents: read

concurrency:
  group: voltguard-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: TypeScript, lint and web export
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Export web app
        run: npx expo export --platform web

  android-native-build:
    if: github.ref != 'refs/heads/phase-6/web-testing' && github.event.pull_request.head.ref != 'phase-6/web-testing'
    name: Android native module compile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Generate Android native project
        run: npx expo prebuild --platform android --no-install

      - name: Compile Android Kotlin
        working-directory: android
        run: ./gradlew :app:compileDebugKotlin

  dependency-audit:
    name: npm dependency security audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Generate npm audit report
        run: |
          npm audit --json > npm-audit.json || true
          node -e "const r=require('./npm-audit.json'); const v=r.metadata?.vulnerabilities ?? {}; console.log('Vulnerability summary:', JSON.stringify(v)); for (const [name, item] of Object.entries(r.vulnerabilities ?? {})) console.log(name + ': ' + item.severity + ' | direct=' + item.isDirect + ' | fixAvailable=' + JSON.stringify(item.fixAvailable));"

      - name: Upload dependency audit report
        uses: actions/upload-artifact@v4
        with:
          name: voltguard-npm-audit-report
          path: npm-audit.json
          if-no-files-found: error
          retention-days: 14

      - name: Enforce production dependency security threshold
        run: npm audit --omit=dev --audit-level=high

  dependency-remediation-preview:
    name: SDK-compatible dependency remediation candidate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply npm fixes within existing semver ranges only
        run: npm audit fix || true

      - name: Verify generated lockfile is reproducible
        run: npm ci

      - name: Capture production and full audit results
        run: |
          npm audit --omit=dev --json > npm-audit-production.json || true
          npm audit --json > npm-audit-full.json || true
          node <<'NODE'
          const fs = require('node:fs');
          for (const file of ['npm-audit-production.json', 'npm-audit-full.json']) {
            const report = JSON.parse(fs.readFileSync(file, 'utf8'));
            console.log(file, JSON.stringify(report.metadata?.vulnerabilities ?? {}));
          }
          NODE

      - name: Validate Expo SDK compatibility
        run: npx expo install --check

      - name: Validate application after candidate updates
        run: |
          npm run typecheck
          npm test
          npm run lint
          npm run build:web

      - name: Upload candidate manifest, lockfile and audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voltguard-sdk54-remediation-candidate
          path: |
            package.json
            package-lock.json
            npm-audit-production.json
            npm-audit-full.json
          if-no-files-found: error
          retention-days: 7
